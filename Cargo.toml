[package]
name = "rustrouter"
version = "0.1.0"
edition = "2024"
description = "PCB autorouter for Specctra DSN designs (Rust port of Freerouting)"
license = "GPL-3.0-only"
homepage = "https://github.com/freerouting/freerouting"
readme = "README.md"
authors = ["RustRouter contributors"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
rayon = "1.12.0"
regex-lite = "0.1.9"
rustc-hash = "2.1.3"
smallvec = "1.16.4"

# mimalloc is faster than the system allocators on Linux and Windows; on macOS the C sources
# do not cross-compile with zig (missing CommonCrypto headers), so the system allocator is used.
[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.dev]
overflow-checks = false
opt-level = 1

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "unwind"

# Release build with line tables for profiling (cargo build --profile profiling).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[package.metadata.deb]
maintainer = "RustRouter contributors"
section = "electronics"
priority = "optional"
depends = "libc6 (>= 2.17)"
extended-description = """\
RustRouter routes printed circuit boards: it reads a Specctra DSN design (as exported by \
KiCad and other CAD tools) and writes a Specctra SES session to import back. It is a Rust \
port of the Freerouting autorouter."""
assets = [
  ["target/release/rustrouter", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/rustrouter/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "PCB autorouter for Specctra DSN designs (Rust port of Freerouting)"
group = "Applications/Engineering"
assets = [
  { source = "target/release/rustrouter", dest = "/usr/bin/rustrouter", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/rustrouter/README.md", mode = "644", doc = true },
]
